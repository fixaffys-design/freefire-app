name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/ff
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          echo 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}} dependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}} rootProject.name="FF"; include(":app")' > settings.gradle.kts
          echo 'plugins{id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "2.0.21" apply false}' > build.gradle.kts
          echo 'org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true' > gradle.properties
          echo 'distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists' > gradle/wrapper/gradle-wrapper.properties
          echo 'plugins{id("com.android.application");id("org.jetbrains.kotlin.android")} android{namespace="com.example.ff";compileSdk=34;defaultConfig{applicationId="com.example.ff";minSdk=26;targetSdk=34;versionCode=1;versionName="1.0"} buildTypes{release{isMinifyEnabled=false}} compileOptions{sourceCompatibility=JavaVersion.VERSION_17;targetCompatibility=JavaVersion.VERSION_17} kotlinOptions{jvmTarget="17"}} dependencies{implementation("androidx.core:core-ktx:1.13.1");implementation("androidx.appcompat:appcompat:1.7.0")}' > app/build.gradle.kts
          echo '-keep class com.example.**{*;}' > app/proguard-rules.pro
          echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="حساسية فري فاير" android:theme="@android:style/Theme.Black.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo '<resources><string name="app_name">حساسية فري فاير</string></resources>' > app/src/main/res/values/strings.xml
          cat > app/src/main/java/com/example/ff/MainActivity.kt <<'KOT'
          package com.example.ff
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import android.app.ActivityManager
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import android.view.Gravity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(s: Bundle?) {
              super.onCreate(s)
              val lay = LinearLayout(this)
              lay.orientation = LinearLayout.VERTICAL
              lay.setPadding(40,40,40,40)
              lay.setBackgroundColor(0xFF101010.toInt())
              lay.gravity = Gravity.CENTER
              val t1 = TextView(this)
              t1.text = "حساسية فري فاير"
              t1.textSize = 26f
              t1.setTextColor(0xFFFF5722.toInt())
              t1.gravity = Gravity.CENTER
              val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
              val mi = ActivityManager.MemoryInfo()
              am.getMemoryInfo(mi)
              val ram = (mi.totalMem/1024/1024/1024).toInt()
              val stat = StatFs(Environment.getDataDirectory().path)
              val free = (stat.availableBytes/1024/1024/1024).toInt()
              val dm = resources.displayMetrics
              val gen = if(ram>=8) 175 else if(ram>=6) 165 else 150
              val level = if(ram>=8) "قوي جدا 🔥" else if(ram>=6) "قوي" else "متوسط"
              val t2 = TextView(this)
              t2.textSize = 18f
              t2.setTextColor(0xFFFFFFFF.toInt())
              t2.gravity = Gravity.CENTER
              t2.text = "\n\nفحص الهاتف:\nالموديل: ${Build.MODEL}\nالرام: ${ram}GB\nالفارغ: ${free}GB\nالشاشة: ${dm.widthPixels}x${dm.heightPixels}\n\nالتصنيف: $level\n\n--- اعدادات فري فاير ---\n\nالعامة: $gen\nالحمراء: ${gen-8}\n2x: ${gen-18}\n4x: ${gen-30}\nالقناص: ${gen-80}\nالحرة: ${gen-25}\nزر الاطلاق: 52%"
              lay.addView(t1)
              lay.addView(t2)
              setContentView(lay)
            }
          }
          KOT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          curl -s https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          echo '#!/bin/sh
          exec gradle "$@"' > gradlew
          chmod +x gradlew
         ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hassasia-freefire-APK
          path: app/build/outputs/apk/debug/app-debug.apk
