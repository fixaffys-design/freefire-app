name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Create Full Project
        run: |
          mkdir -p app/src/main/java/com/example/freefiresensitivityscanner
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FreeFireSensitivityScanner"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.freefiresensitivityscanner"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.freefiresensitivityscanner"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Free Fire Sensitivity Scanner"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF5722</item>
                  <item name="android:navigationBarColor">#101010</item>
                  <item name="android:statusBarColor">#101010</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/freefiresensitivityscanner/MainActivity.kt <<'KOT'
          package com.example.freefiresensitivityscanner
          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.StatFs
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.roundToInt
          class MainActivity : AppCompatActivity() {
              private lateinit var resultText: TextView
              private lateinit var scanButton: Button
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createInterface()
                  scanButton.setOnClickListener { scanDevice() }
                  scanDevice()
              }
              private fun createInterface() {
                  val scrollView = ScrollView(this)
                  val mainLayout = LinearLayout(this)
                  mainLayout.orientation = LinearLayout.VERTICAL
                  mainLayout.setPadding(dp(18), dp(18), dp(18), dp(18))
                  mainLayout.setBackgroundColor(0xFF101010.toInt())
                  val title = TextView(this)
                  title.text = "Free Fire Sensitivity Scanner"
                  title.textSize = 24f
                  title.gravity = Gravity.CENTER
                  title.setTextColor(0xFFFF5722.toInt())
                  title.setPadding(0, 0, 0, dp(12))
                  val subtitle = TextView(this)
                  subtitle.text = "فحص الهاتف وإعطاء إعدادات مناسبة لـ Free Fire العادية"
                  subtitle.textSize = 15f
                  subtitle.gravity = Gravity.CENTER
                  subtitle.setTextColor(0xFFFFFFFF.toInt())
                  subtitle.setPadding(0, 0, 0, dp(18))
                  scanButton = Button(this)
                  scanButton.text = "فحص الهاتف الآن"
                  scanButton.textSize = 16f
                  scanButton.setTextColor(0xFFFFFFFF.toInt())
                  scanButton.setBackgroundColor(0xFFE64A19.toInt())
                  resultText = TextView(this)
                  resultText.textSize = 16f
                  resultText.setTextColor(0xFFFFFFFF.toInt())
                  resultText.setPadding(dp(8), dp(20), dp(8), dp(20))
                  resultText.textDirection = View.TEXT_DIRECTION_RTL
                  mainLayout.addView(title, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  mainLayout.addView(subtitle, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  mainLayout.addView(scanButton, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  mainLayout.addView(resultText, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  scrollView.addView(mainLayout)
                  setContentView(scrollView)
              }
              private fun scanDevice() {
                  resultText.text = "جاري فحص الهاتف..."
                  val deviceInfo = DeviceScanner(this).readDeviceInfo()
                  val settings = SensitivityCalculator.calculate(deviceInfo)
                  val result = StringBuilder()
                  result.append("نتيجة فحص الهاتف\n====================\n\n")
                  result.append("نوع الهاتف:\n${deviceInfo.manufacturer} ${deviceInfo.model}\n\n")
                  result.append("إصدار Android:\n${deviceInfo.androidVersion}\n\n")
                  result.append("المعالج:\n${deviceInfo.processor}\n\n")
                  result.append("الشركة المصنعة للمعالج:\n${deviceInfo.socManufacturer}\n\n")
                  result.append("عدد أنوية المعالج:\n${deviceInfo.cpuCores}\n\n")
                  result.append("RAM الكلية:\n${deviceInfo.totalRamGb} GB\n\n")
                  result.append("RAM المتاحة حاليًا:\n${deviceInfo.availableRamGb} GB\n\n")
                  result.append("مساحة التخزين الكلية:\n${deviceInfo.totalStorageGb} GB\n\n")
                  result.append("مساحة التخزين الفارغة:\n${deviceInfo.freeStorageGb} GB\n\n")
                  result.append("دقة الشاشة:\n${deviceInfo.screenWidth} x ${deviceInfo.screenHeight}\n\n")
                  result.append("DPI:\n${deviceInfo.dpi} - للقراءة فقط، لم يتم تعديله\n\n")
                  result.append("معدل تحديث الشاشة:\n${deviceInfo.refreshRate} Hz\n\n")
                  result.append("حرارة البطارية:\n${deviceInfo.batteryTemperature} °C\n\n")
                  result.append("تصنيف الهاتف:\n${settings.phoneLevel}\n\n")
                  result.append("إعدادات Free Fire المقترحة\n====================\n\n")
                  result.append("العامة: ${settings.general}\n")
                  result.append("النقطة الحمراء: ${settings.redDot}\n")
                  result.append("منظار 2x: ${settings.scope2x}\n")
                  result.append("منظار 4x: ${settings.scope4x}\n")
                  result.append("القناص: ${settings.sniper}\n")
                  result.append("النظرة الحرة: ${settings.freeLook}\n")
                  result.append("حجم زر الإطلاق: ${settings.fireButton}%\n\n")
                  result.append("إعدادات الأداء المقترحة\n====================\n\n")
                  result.append("الجودة: ${settings.graphics}\n")
                  result.append("معدل الإطارات: ${settings.frameRate}\n\n")
                  result.append("ملاحظة:\nهذه القيم مقترحة بناءً على مواصفات الهاتف. يمكن تعديلها يدويًا داخل Free Fire حسب أسلوب لعبك.")
                  resultText.text = result.toString()
              }
              private fun dp(value: Int): Int { return (value * resources.displayMetrics.density).roundToInt() }
          }
          KOT

          cat > app/src/main/java/com/example/freefiresensitivityscanner/DeviceScanner.kt <<'KOT'
          package com.example.freefiresensitivityscanner
          import android.app.ActivityManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import android.view.WindowManager
          import kotlin.math.roundToInt
          data class DeviceInfo(val manufacturer: String, val model: String, val androidVersion: String, val processor: String, val socManufacturer: String, val cpuCores: Int, val totalRamGb: Int, val availableRamGb: Int, val totalStorageGb: Int, val freeStorageGb: Int, val screenWidth: Int, val screenHeight: Int, val dpi: Int, val refreshRate: Int, val batteryTemperature: Float)
          class DeviceScanner(private val context: Context) {
              fun readDeviceInfo(): DeviceInfo {
                  val activityManager = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val memoryInfo = ActivityManager.MemoryInfo()
                  activityManager.getMemoryInfo(memoryInfo)
                  val totalRamGb = (memoryInfo.totalMem.toDouble() / 1024.0 / 1024.0 / 1024.0).roundToInt().coerceAtLeast(1)
                  val availableRamGb = (memoryInfo.availMem.toDouble() / 1024.0 / 1024.0 / 1024.0).roundToInt().coerceAtLeast(0)
                  val statFs = StatFs(Environment.getDataDirectory().path)
                  val totalStorageGb = (statFs.totalBytes.toDouble() / 1024.0 / 1024.0 / 1024.0).roundToInt()
                  val freeStorageGb = (statFs.availableBytes.toDouble() / 1024.0 / 1024.0 / 1024.0).roundToInt()
                  val displayMetrics = context.resources.displayMetrics
                  val screenWidth = displayMetrics.widthPixels
                  val screenHeight = displayMetrics.heightPixels
                  val dpi = displayMetrics.densityDpi
                  val windowManager = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val refreshRate = windowManager.defaultDisplay.refreshRate.roundToInt().coerceAtLeast(1)
                  val batteryIntent = context.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val batteryTemperatureRaw = batteryIntent?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, -1)?: -1
                  val batteryTemperature = if (batteryTemperatureRaw > 0) { batteryTemperatureRaw / 10f } else { 0f }
                  val processor = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) { "${Build.SOC_MANUFACTURER} ${Build.SOC_MODEL}" } else { Build.HARDWARE }
                  val socManufacturer = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) { Build.SOC_MANUFACTURER } else { "غير متاح في هذا الإصدار" }
                  return DeviceInfo(manufacturer = Build.MANUFACTURER, model = Build.MODEL, androidVersion = Build.VERSION.RELEASE, processor = processor, socManufacturer = socManufacturer, cpuCores = Runtime.getRuntime().availableProcessors(), totalRamGb = totalRamGb, availableRamGb = availableRamGb, totalStorageGb = totalStorageGb, freeStorageGb = freeStorageGb, screenWidth = screenWidth, screenHeight = screenHeight, dpi = dpi, refreshRate = refreshRate, batteryTemperature = batteryTemperature)
              }
          }
          KOT

          cat > app/src/main/java/com/example/freefiresensitivityscanner/SensitivityCalculator.kt <<'KOT'
          package com.example.freefiresensitivityscanner
          import kotlin.math.max
          import kotlin.math.min
          data class GameSettings(val phoneLevel: String, val general: Int, val redDot: Int, val scope2x: Int, val scope4x: Int, val sniper: Int, val freeLook: Int, val fireButton: Int, val graphics: String, val frameRate: String)
          object SensitivityCalculator {
              fun calculate(info: DeviceInfo): GameSettings {
                  val performanceScore = calculatePerformanceScore(info)
                  val phoneLevel = when { performanceScore >= 85 -> "قوي جدًا"; performanceScore >= 65 -> "قوي"; performanceScore >= 45 -> "متوسط"; else -> "ضعيف" }
                  val general = when { performanceScore >= 85 -> 175; performanceScore >= 65 -> 165; performanceScore >= 45 -> 150; else -> 135 }
                  val redDot = limit(general - 8)
                  val scope2x = limit(general - 18)
                  val scope4x = limit(general - 30)
                  val sniper = limit(general - 80)
                  val freeLook = limit(general - 25)
                  val fireButton = when { performanceScore >= 75 -> 52; performanceScore >= 50 -> 50; else -> 48 }
                  val graphics: String
                  val frameRate: String
                  when {
                      performanceScore >= 85 -> { graphics = "Ultra أو أعلى جودة متاحة"; frameRate = "مرتفع جدًا" }
                      performanceScore >= 65 -> { graphics = "عالٍ"; frameRate = "مرتفع" }
                      performanceScore >= 45 -> { graphics = "قياسي"; frameRate = "مرتفع إذا لم ترتفع الحرارة" }
                      else -> { graphics = "سلس"; frameRate = "عادي" }
                  }
                  return GameSettings(phoneLevel, general, redDot, scope2x, scope4x, sniper, freeLook, fireButton, graphics, frameRate)
              }
              private fun calculatePerformanceScore(info: DeviceInfo): Int {
                  var score = 0
                  score += when { info.totalRamGb >= 12 -> 35; info.totalRamGb >= 8 -> 30; info.totalRamGb >= 6 -> 25; info.totalRamGb >= 4 -> 18; else -> 10 }
                  score += when { info.cpuCores >= 12 -> 30; info.cpuCores >= 8 -> 25; info.cpuCores >= 6 -> 20; info.cpuCores >= 4 -> 14; else -> 8 }
                  score += when { info.refreshRate >= 120 -> 20; info.refreshRate >= 90 -> 16; info.refreshRate >= 60 -> 12; else -> 7 }
                  score += when { info.freeStorageGb >= 20 -> 15; info.freeStorageGb >= 10 -> 10; info.freeStorageGb >= 5 -> 6; else -> 2 }
                  if (info.batteryTemperature > 40f) { score -= 10 }
                  return score.coerceIn(0, 100)
              }
              private fun limit(value: Int): Int { return min(200, max(0, value)) }
          }
          KOT

      - name: Build APK
        run: |
          curl -s https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          echo "#!/bin/sh" > gradlew
          echo 'exec gradle "$@"' >> gradlew
          chmod +x gradlew
         ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FreeFire-APK
          path: app/build/outputs/apk/debug/app-debug.apk
