name: Build Single File APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/example/freefiresensitivityscanner
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FreeFireSensitivityScanner"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "2.0.21" apply false }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
            namespace = "com.example.freefiresensitivityscanner"
            compileSdk = 34
            defaultConfig { applicationId = "com.example.freefiresensitivityscanner"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0"; archivesBaseName.set("حساسية-فري-فاير") }
            buildTypes { release { isMinifyEnabled = false } }
            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1"); implementation("androidx.appcompat:appcompat:1.7.0") }
          EOF
          cat > app/proguard-rules.pro <<'EOF'
          -keep class com.example.** { *; }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:allowBackup="true" android:label="حساسية فري فاير" android:theme="@android:style/Theme.Black.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">حساسية فري فاير</string></resources>
          EOF
          cat > app/src/main/java/com/example/freefiresensitivityscanner/MainActivity.kt <<'EOF'
          package com.example.freefiresensitivityscanner
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import android.app.ActivityManager
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.os.StatFs
          import android.view.Gravity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val lay = android.widget.LinearLayout(this)
              lay.orientation = android.widget.LinearLayout.VERTICAL
              lay.setPadding(30,30,30,30)
              lay.gravity = Gravity.CENTER
              lay.setBackgroundColor(0xFF101010.toInt())
              val title = TextView(this)
              title.text = "حساسية فري فاير"
              title.textSize = 26f
              title.setTextColor(0xFFFF5722.toInt())
              title.gravity = Gravity.CENTER
              val txt = TextView(this)
              txt.textSize = 18f
              txt.setTextColor(0xFFFFFFFF.toInt())
              val am = getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
              val mi = ActivityManager.MemoryInfo()
              am.getMemoryInfo(mi)
              val totalRam = (mi.totalMem/1024/1024/1024).toInt()
              val stat = StatFs(Environment.getDataDirectory().path)
              val free = (stat.availableBytes/1024/1024/1024).toInt()
              val dm = resources.displayMetrics
              val level = if(totalRam>=8) "قوي جدا 🔥" else if(totalRam>=6) "قوي" else "متوسط"
              val gen = if(totalRam>=8) 175 else if(totalRam>=6) 165 else 150
              txt.text = "\n\nفحص الهاتف:\nالموديل: ${Build.MODEL}\nالرام: ${totalRam}GB\nالفارغ: ${free}GB\nالشاشة: ${dm.widthPixels}x${dm.heightPixels}\n\nالتصنيف: $level\n\n--- اعدادات فري فاير ---\n\nالعامة: $gen\nالنقطة الحمراء: ${gen-8}\nسكوب 2x: ${gen-18}\nسكوب 4x: ${gen-30}\nالقناص: ${gen-80}\nالنظرة الحرة: ${gen-25}\nزر الاطلاق: 52%\n\nالجودة: Ultra"
              txt.gravity = Gravity.CENTER
              lay.addView(title)
              lay.addView(txt)
              setContentView(lay)
            }
          }
          EOF
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          curl -s "https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          echo -e '#!/bin/sh\nexec gradle "$@"' > gradlew
          chmod +x gradlew
         ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: حساسية-فري-فاير-APK, path: app/build/outputs/apk/debug/app-debug.apk }
